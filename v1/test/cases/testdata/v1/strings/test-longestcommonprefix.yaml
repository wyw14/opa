    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(input.strings)
        }
    input:
      strings:
        - a/app
        - 1
    want_error: "test-0.rego:4: eval_type_error: strings.longest_common_prefix: operand 1 must be array of strings but got array containing number"
    strict_error: true
  - note: strings/longest_common_prefix/type_error_strict_set_element
    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(strings_set)
        }

        strings_set contains s if {
