        - a/app
        - true
    want_error: "test-0.rego:4: eval_type_error: strings.longest_common_prefix: operand 1 must be set of strings but got set containing boolean"
    strict_error: true
  - note: strings/longest_common_prefix/type_error_strict_outer
    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(input.strings)
        }
    input:
      strings: 1
    want_error: "test-0.rego:4: eval_type_error: strings.longest_common_prefix: operand 1 must be one of {set, array} but got number"
    strict_error: true
