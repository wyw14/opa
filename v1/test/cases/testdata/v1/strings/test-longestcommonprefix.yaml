---
cases:
  - note: strings/longest_common_prefix/array
    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(input.strings)
        }
    input:
      strings:
        - kube-system
        - kube-public
        - kube-node-lease
    want_result:
      - x: kube-
  - note: strings/longest_common_prefix/set
    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(strings_set)
        }

        strings_set contains s if {
        	s := input.strings[_]
        }
    input:
      strings:
        - production/web/app
        - production/web/auth
        - production/web/gateway
    want_result:
      - x: production/web/
  - note: strings/longest_common_prefix/one_element_is_prefix
    query: data.test.p = x
    modules:
      - |
        package test

        p := result if {
        	result := strings.longest_common_prefix(input.strings)
        }
    input:
